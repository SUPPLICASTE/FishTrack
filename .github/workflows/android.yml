name: Build and release FishTrack APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project and permanent application ID
        run: |
          test -d app/src/main
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
          grep -Fqx '        applicationId = "org.fishtrack.app"' app/build.gradle.kts
          grep -Fq 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          echo "FishTrack applicationId is fixed: org.fishtrack.app"

      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Permanent signing secrets are missing. Refusing to publish an APK with a temporary signing key."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/fishtrack-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      # Increase only versionCode; never modify applicationId.
      - name: Set build version
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          sed -i -E "s/versionCode = [0-9]+/versionCode = $GITHUB_RUN_NUMBER/" app/build.gradle.kts
          echo "Building FishTrack versionCode $GITHUB_RUN_NUMBER"

      - name: Build debug APK
        if: startsWith(github.ref, 'refs/heads/')
        run: gradle :app:assembleDebug

      - name: Verify permanent APK signature
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -F "Signer #1 certificate SHA-256 digest: 380674c527d9d260cbaedeefc43442c31dcd52d8c536a9eb6486a191a14163e6" "$RUNNER_TEMP/apk-signature.txt"

      - name: Upload APK
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: FishTrack-APK-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          sed -i -E "s/versionCode = [0-9]+/versionCode = $GITHUB_RUN_NUMBER/" app/build.gradle.kts

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: gradle :app:assembleRelease

      - name: Verify permanent release signature
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -F "Signer #1 certificate SHA-256 digest: 380674c527d9d260cbaedeefc43442c31dcd52d8c536a9eb6486a191a14163e6" "$RUNNER_TEMP/apk-signature.txt"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
            --title "FishTrack $GITHUB_REF_NAME" \
            --notes "Nueva versión de FishTrack."
