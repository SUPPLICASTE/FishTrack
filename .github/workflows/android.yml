name: Build and release FishTrack APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project identity and data persistence
        run: |
          test -d app/src/main
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
          grep -Fqx '        applicationId = "org.fishtrack.app"' app/build.gradle.kts
          grep -Fq 'web.settings.domStorageEnabled = true' app/src/main/java/org/fishtrack/app/MainActivity.kt
          grep -Fq 'fishtrack-webstorage-backup.json' app/src/main/java/org/fishtrack/app/MainActivity.kt
          echo "Application ID fixed; WebView storage and local recovery snapshot found."

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/fishtrack.keystore
          test -s app/fishtrack.keystore
          keytool -list -keystore app/fishtrack.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Permanent FishTrack signing key restored."

      - name: Set increasing version code
        run: |
          sed -i -E "s/versionCode = [0-9]+/versionCode = $GITHUB_RUN_NUMBER/" app/build.gradle.kts
          echo "Using versionCode $GITHUB_RUN_NUMBER"

      - name: Build signed release APK
        run: gradle :app:assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "Release APK is signed and verified."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FishTrack-APK-build-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$VERSION\"/" app/build.gradle.kts

      - name: Build tagged release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: gradle :app:assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
            --title "FishTrack $GITHUB_REF_NAME" \
            --notes "Nueva versión de FishTrack."
