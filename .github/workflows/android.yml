
name: Build and publish FishTrack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build FishTrack APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Comprobar archivos del proyecto
        run: |
          echo "Contenido de la raiz:"
          ls -la
          echo "Archivos Gradle:"
          find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \)

      - name: Comprobar AndroidManifest
        run: |
          echo "=== CONTENIDO DEL MANIFEST ==="
          cat -n app/src/main/AndroidManifest.xml

          echo "=== VALIDAR XML ==="
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML CORRECTO')"

      - name: Compilar APK
        run: gradle :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FishTrack-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
