name: Build and release FishTrack APK
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify project
        run: |
          test -d app/src/main
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
      - name: Require persistent signing key for update APKs
        if: startsWith(github.ref, 'refs/heads/')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64. No se generará una APK con firma temporal incompatible." && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Falta ANDROID_KEYSTORE_PASSWORD." && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Falta ANDROID_KEY_ALIAS." && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Falta ANDROID_KEY_PASSWORD." && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fishtrack-release.jks"
          test -s "$RUNNER_TEMP/fishtrack-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/fishtrack-release.jks" >> "$GITHUB_ENV"
      - name: Build debug APK
        if: startsWith(github.ref, 'refs/heads/')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleDebug
      - name: Upload debug APK
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: FishTrack-3.3.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check release signing secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing GitHub secret ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing GitHub secret ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing GitHub secret ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing GitHub secret ANDROID_KEY_PASSWORD" && exit 1)
      - name: Prepare signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fishtrack-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/fishtrack-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
            --title "FishTrack $GITHUB_REF_NAME" \
            --notes "Actualización oficial de FishTrack. Instala esta APK sobre la versión anterior."
