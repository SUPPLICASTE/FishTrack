
name: Build FishTrack APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify app identity and local data storage
        run: |
          test -d app/src/main
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
          grep -Fqx '        applicationId = "org.fishtrack.app"' app/build.gradle.kts
          grep -Fq 'web.settings.domStorageEnabled = true' app/src/main/java/org/fishtrack/app/MainActivity.kt
          grep -Fq 'fishtrack-webstorage-backup.json' app/src/main/java/org/fishtrack/app/MainActivity.kt
          echo "OK: fixed application ID and local WebView data recovery are present."

      - name: Inspect currently published APK signing certificate
        continue-on-error: true
        run: |
          APK_URL="https://github.com/SUPPLICASTE/FishTrack/releases/download/FishTrack/FishTrack.apk"
          curl -fL --retry 3 "$APK_URL" -o /tmp/FishTrack-existing.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs /tmp/FishTrack-existing.apk

      - name: Set increasing version code
        run: |
          sed -i -E "s/versionCode = [0-9]+/versionCode = $GITHUB_RUN_NUMBER/" app/build.gradle.kts
          echo "Using versionCode $GITHUB_RUN_NUMBER"

      - name: Build debug APK for testing
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FishTrack-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Restore permanent release key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > app/fishtrack.keystore
          test -s app/fishtrack.keystore
          keytool -list -keystore app/fishtrack.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify release APK signature
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FishTrack-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK on version tag
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: Explain release signing is not configured
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::warning::Debug APK built successfully. A permanent signed release APK is not produced until the four signing secrets are configured."
